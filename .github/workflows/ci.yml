name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v4
        if: runner.os == 'Linux'
        with:
          version: 9
      - uses: actions/setup-node@v4
        if: runner.os == 'Linux'
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: studio/pnpm-lock.yaml
      - if: runner.os == 'Linux'
        run: pnpm --dir studio install --frozen-lockfile
      - if: runner.os == 'Linux'
        run: pnpm --dir studio test
      - if: runner.os == 'Linux'
        run: pnpm --dir studio run lint
      - if: runner.os == 'Linux'
        run: pnpm --dir studio build
      - if: runner.os == 'Linux'
        run: pnpm --dir vscode check
      - if: runner.os == 'Linux'
        run: pnpm --dir vscode test
      - run: go generate ./internal/sosbuild
      - run: go test ./...
      - run: go vet ./...
      - if: runner.os != 'Windows'
        run: go test -race ./sos ./internal/soslsp ./internal/studio ./tests/e2e -count=1 -timeout=180s
      - run: go build ./cmd/...
