name: Release SysOneScript

on:
  push:
    tags:
      - 'vscode-v*'

permissions:
  contents: read

concurrency:
  group: sysonescript-release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.21.1

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - run: pnpm --dir vscode install --frozen-lockfile

      - name: Test and vet runtime
        run: |
          go test ./...
          go vet ./...
          go build -trimpath -o /tmp/sos-release-smoke ./cmd/sos
          test "$(/tmp/sos-release-smoke version)" = "sos $(node -p "require('./vscode/package.json').version")"

      - name: Check extension
        run: pnpm --dir vscode check

      - name: Test extension
        run: pnpm --dir vscode test

      - name: Verify tag matches extension version
        run: |
          expected="${GITHUB_REF_NAME#vscode-v}"
          actual="$(node -p "require('./vscode/package.json').version")"
          test "$expected" = "$actual" || {
            echo "Tag version $expected does not match package version $actual"
            exit 1
          }

      - name: Verify runtime and release documentation versions
        run: node vscode/test/release-contract.js

      - name: Verify generated language and documentation artifacts
        run: |
          go generate ./sos ./internal/sosbuild
          git diff --exit-code -- sos/semantic_lexicon_generated.go internal/sosbuild/sources.zip
          python3 docs-site/scripts/sync_content.py --check

  build:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            goos: darwin
            goarch: arm64
            binary: sos
            archive: tar.gz
          - target: darwin-x64
            goos: darwin
            goarch: amd64
            binary: sos
            archive: tar.gz
          - target: linux-arm64
            goos: linux
            goarch: arm64
            binary: sos
            archive: tar.gz
          - target: linux-x64
            goos: linux
            goarch: amd64
            binary: sos
            archive: tar.gz
          - target: win32-arm64
            goos: windows
            goarch: arm64
            binary: sos.exe
            archive: zip
          - target: win32-x64
            goos: windows
            goarch: amd64
            binary: sos.exe
            archive: zip
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.21.1

      - run: pnpm --dir vscode install --frozen-lockfile

      - name: Build source bundle
        run: go generate ./sos ./internal/sosbuild

      - name: Build language server and CLIs
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          version="${GITHUB_REF_NAME#vscode-v}"
          rm -rf vscode/bin release/cli
          mkdir -p vscode/bin release/cli
          version_ldflag="-X github.com/DonaldMurillo/system-one-playground/sos.Version=$version -X github.com/DonaldMurillo/system-one-playground/sos.ReleaseMarker=SysOneScriptVersion=$version"
          go build -trimpath -ldflags "$version_ldflag" -o "vscode/bin/${{ matrix.binary }}" ./cmd/sos
          go build -trimpath -ldflags "$version_ldflag" -o "release/cli/${{ matrix.binary }}" ./cmd/sos
          if [ "${{ matrix.goos }}" = "windows" ]; then
            go build -trimpath -ldflags "$version_ldflag" -o release/cli/sysone.exe ./cmd/sysone
          else
            go build -trimpath -ldflags "$version_ldflag" -o release/cli/sysone ./cmd/sysone
          fi
          cp LICENSE release/cli/
          cp README.md release/cli/
          find release/cli -exec touch -h -d '@0' {} +
          archive_base="sysonescript-cli-v${version}-${{ matrix.target }}"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            (cd release/cli && find . -type f -print | LC_ALL=C sort | zip -X -q "../${archive_base}.zip" -@)
          else
            tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner -C release/cli -czf "release/${archive_base}.tar.gz" .
          fi

      - name: Package platform extension
        working-directory: vscode
        env:
          SYSONESCRIPT_EXPECTED_TARGET: ${{ matrix.target }}
        run: |
          pnpm exec vsce package --no-dependencies --target "${{ matrix.target }}"
          ../scripts/normalize-vsix.sh ./*.vsix
          cp ./*.vsix /tmp/first.vsix
          pnpm exec vsce package --no-dependencies --target "${{ matrix.target }}"
          ../scripts/normalize-vsix.sh ./*.vsix
          cmp /tmp/first.vsix ./*.vsix
          pnpm run package:smoke -- *.vsix

      - name: Collect release artifacts
        run: |
          mkdir -p release/assets
          mv vscode/*.vsix release/assets/
          find release -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec mv {} release/assets/ \;

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.target }}
          path: release/assets/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: marketplace
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.21.1

      - run: pnpm --dir vscode install --frozen-lockfile

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Generate CLI checksums
        run: |
          cp scripts/install.sh scripts/install.ps1 release/
          cd release
          sha256sum ./*.tar.gz ./*.zip ./install.sh ./install.ps1 | sed 's#  \./#  #' > checksums.txt

      - name: Publish GitHub CLI release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#vscode-v}"
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          test "$(git rev-parse "${GITHUB_REF_NAME}^{commit}")" = "$GITHUB_SHA"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/*.tar.gz release/*.zip release/checksums.txt release/install.sh release/install.ps1 --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/*.tar.gz release/*.zip release/checksums.txt release/install.sh release/install.ps1 \
              --verify-tag \
              --title "SysOneScript v${version}" \
              --generate-notes
          fi

      - name: Publish platform extensions when configured
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "VSCE_PAT is not configured; platform VSIX artifacts are ready for manual Marketplace upload."
            exit 0
          fi
          for vsix in release/*.vsix; do
            pnpm --dir vscode exec vsce publish --no-dependencies --packagePath "$vsix"
          done
