name: Release SysOneScript

on:
  push:
    tags:
      - 'vscode-v*'

permissions:
  contents: read

concurrency:
  group: sysonescript-release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.21.1

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - run: pnpm --dir vscode install --frozen-lockfile

      - name: Test and vet runtime
        run: |
          go test ./...
          go vet ./...
          go build -trimpath -o /tmp/sos-release-smoke ./cmd/sos
          test "$(/tmp/sos-release-smoke version)" = "sos $(node -p "require('./vscode/package.json').version")"

      - name: Check extension
        run: pnpm --dir vscode check

      - name: Test extension
        run: pnpm --dir vscode test

      - name: Verify tag matches extension version
        run: |
          expected="${GITHUB_REF_NAME#vscode-v}"
          actual="$(node -p "require('./vscode/package.json').version")"
          test "$expected" = "$actual" || {
            echo "Tag version $expected does not match package version $actual"
            exit 1
          }

      - name: Verify runtime and release documentation versions
        run: node vscode/test/release-contract.js

      - name: Verify generated language and documentation artifacts
        run: |
          go generate ./sos ./internal/sosbuild
          git diff --exit-code -- sos/semantic_lexicon_generated.go internal/sosbuild/sources.zip
          python3 docs-site/scripts/sync_content.py --check

  build:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            goos: darwin
            goarch: arm64
            binary: sos
            archive: tar.gz
          - target: darwin-x64
            goos: darwin
            goarch: amd64
            binary: sos
            archive: tar.gz
          - target: linux-arm64
            goos: linux
            goarch: arm64
            binary: sos
            archive: tar.gz
          - target: linux-x64
            goos: linux
            goarch: amd64
            binary: sos
            archive: tar.gz
          - target: win32-arm64
            goos: windows
            goarch: arm64
            binary: sos.exe
            archive: zip
          - target: win32-x64
            goos: windows
            goarch: amd64
            binary: sos.exe
            archive: zip
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.21.1

      - run: pnpm --dir vscode install --frozen-lockfile

      - name: Build source bundle
        run: go generate ./sos ./internal/sosbuild

      - name: Build language server and CLIs
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          version="${GITHUB_REF_NAME#vscode-v}"
          rm -rf vscode/bin release/cli
          mkdir -p vscode/bin release/cli
          version_ldflag="-buildid= -X github.com/DonaldMurillo/system-one-playground/sos.Version=$version -X github.com/DonaldMurillo/system-one-playground/sos.ReleaseMarker=SysOneScriptVersion=$version;SysOneScriptVersionEnd"
          go build -trimpath -buildvcs=false -ldflags "$version_ldflag" -o "vscode/bin/${{ matrix.binary }}" ./cmd/sos
          go build -trimpath -buildvcs=false -ldflags "$version_ldflag" -o "release/cli/${{ matrix.binary }}" ./cmd/sos
          GOOS=linux GOARCH=amd64 go build -trimpath -buildvcs=false -o /tmp/sosverify ./cmd/sosverify
          if [ "${{ matrix.goos }}" = "windows" ]; then
            go build -trimpath -buildvcs=false -ldflags "$version_ldflag" -o release/cli/sysone.exe ./cmd/sysone
            legacy_binary=release/cli/sysone.exe
          else
            go build -trimpath -buildvcs=false -ldflags "$version_ldflag" -o release/cli/sysone ./cmd/sysone
            legacy_binary=release/cli/sysone
          fi
          expected_marker="SysOneScriptVersion=${version};SysOneScriptVersionEnd"
          /tmp/sosverify "vscode/bin/${{ matrix.binary }}" "$expected_marker"
          /tmp/sosverify "release/cli/${{ matrix.binary }}" "$expected_marker"
          for binary in "vscode/bin/${{ matrix.binary }}" "release/cli/${{ matrix.binary }}" "$legacy_binary"; do
            metadata="$(go version -m "$binary")"
            grep -Fqx $'\tbuild\tGOOS=${{ matrix.goos }}' <<<"$metadata"
            grep -Fqx $'\tbuild\tGOARCH=${{ matrix.goarch }}' <<<"$metadata"
          done
          go build -trimpath -buildvcs=false -ldflags "$version_ldflag" -o /tmp/sos-rebuild ./cmd/sos
          go build -trimpath -buildvcs=false -ldflags "$version_ldflag" -o /tmp/sysone-rebuild ./cmd/sysone
          cmp "release/cli/${{ matrix.binary }}" /tmp/sos-rebuild
          cmp "$legacy_binary" /tmp/sysone-rebuild
          cp LICENSE release/cli/
          cp README.md release/cli/
          find release/cli -exec touch -h -d '@0' {} +
          archive_base="sysonescript-cli-v${version}-${{ matrix.target }}"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            (cd release/cli && find . -type f -print | LC_ALL=C sort | zip -X -q "../${archive_base}.zip" -@)
            cp "release/${archive_base}.zip" /tmp/first-cli-archive
            rm "release/${archive_base}.zip"
            (cd release/cli && find . -type f -print | LC_ALL=C sort | zip -X -q "../${archive_base}.zip" -@)
          else
            tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner -C release/cli -czf "release/${archive_base}.tar.gz" .
            cp "release/${archive_base}.tar.gz" /tmp/first-cli-archive
            rm "release/${archive_base}.tar.gz"
            tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner -C release/cli -czf "release/${archive_base}.tar.gz" .
          fi
          cmp /tmp/first-cli-archive "release/${archive_base}.${{ matrix.archive }}"

      - name: Package platform extension
        working-directory: vscode
        env:
          SYSONESCRIPT_EXPECTED_TARGET: ${{ matrix.target }}
        run: |
          pnpm exec vsce package --no-dependencies --target "${{ matrix.target }}"
          ../scripts/normalize-vsix.sh ./*.vsix
          cp ./*.vsix /tmp/first.vsix
          pnpm exec vsce package --no-dependencies --target "${{ matrix.target }}"
          ../scripts/normalize-vsix.sh ./*.vsix
          cmp /tmp/first.vsix ./*.vsix
          pnpm run package:smoke -- *.vsix

      - name: Collect release artifacts
        run: |
          mkdir -p release/assets
          mv vscode/*.vsix release/assets/
          find release -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec mv {} release/assets/ \;

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.target }}
          path: release/assets/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: marketplace
    permissions:
      contents: write
      attestations: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.21.1

      - run: pnpm --dir vscode install --frozen-lockfile

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Generate CLI checksums
        run: |
          cp scripts/install.sh scripts/install.ps1 release/
          cd release
          sha256sum ./*.tar.gz ./*.zip ./install.sh ./install.ps1 | sed 's#  \./#  #' > checksums.txt

      - name: Publish GitHub CLI release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#vscode-v}"
          mapfile -t ruleset_ids < <(gh api --paginate "repos/${GITHUB_REPOSITORY}/rulesets?per_page=100" --jq '.[] | select(.name == "Immutable SysOneScript release tags" and .target == "tag" and .enforcement == "active") | .id')
          test "${#ruleset_ids[@]}" -eq 1
          ruleset_id="${ruleset_ids[0]}"
          verify_tag() {
            git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
            test "$(git rev-parse "${GITHUB_REF_NAME}^{commit}")" = "$GITHUB_SHA"
          }
          verify_release_guard() {
            gh api "repos/${GITHUB_REPOSITORY}/rulesets/${ruleset_id}" --jq '
              (.target == "tag" and .enforcement == "active") and
              (.conditions.ref_name.include | index("refs/tags/vscode-v*") != null) and
              (.conditions.ref_name.exclude | length == 0) and
              ([.rules[].type] | index("update") != null) and
              ([.rules[].type] | index("deletion") != null) and
              (.bypass_actors | length == 0)' | grep -qx true
            verify_tag
          }
          verify_release_guard
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --draft \
              --verify-tag \
              --title "SysOneScript v${version}" \
              --generate-notes
          fi
          if [ "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" = "true" ]; then
            gh release upload "$GITHUB_REF_NAME" release/*.vsix release/*.tar.gz release/*.zip release/checksums.txt release/install.sh release/install.ps1 --clobber
            verify_release_guard
            gh release edit "$GITHUB_REF_NAME" --draft=false --verify-tag --title "SysOneScript v${version}"
          else
            echo "GitHub Release $GITHUB_REF_NAME is already published; immutable assets are unchanged."
          fi
          verify_release_guard
          expected_assets="$(find release -maxdepth 1 -type f \( -name '*.vsix' -o -name '*.tar.gz' -o -name '*.zip' -o -name 'checksums.txt' -o -name 'install.sh' -o -name 'install.ps1' \) -exec basename {} \; | LC_ALL=C sort)"
          remote_assets="$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' | LC_ALL=C sort)"
          test "$remote_assets" = "$expected_assets"
          verify_dir="$(mktemp -d)"
          trap 'rm -rf "$verify_dir"' EXIT
          gh release download "$GITHUB_REF_NAME" --dir "$verify_dir"
          while IFS= read -r asset; do
            cmp "release/$asset" "$verify_dir/$asset"
          done <<<"$expected_assets"
          verified=false
          for attempt in $(seq 1 12); do
            if gh release verify "$GITHUB_REF_NAME"; then
              verified=true
              break
            fi
            echo "Release attestation is not available yet (attempt ${attempt}/12)."
            sleep 10
          done
          test "$verified" = true

      - name: Publish platform extensions when configured
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "VSCE_PAT is not configured; platform VSIX artifacts are ready for manual Marketplace upload."
            exit 0
          fi
          shopt -s nullglob
          packages=(release/*.vsix)
          test "${#packages[@]}" -eq 6
          publisher="$(node -p "require('./vscode/package.json').publisher")"
          extension_name="$(node -p "require('./vscode/package.json').name")"
          version="$(node -p "require('./vscode/package.json').version")"
          for vsix in "${packages[@]}"; do
            package_path="$(realpath "$vsix")"
            target="$(basename "$vsix")"
            target="${target#"${extension_name}-"}"
            target="${target%-"${version}.vsix"}"
            marketplace_url="https://marketplace.visualstudio.com/_apis/public/gallery/publishers/${publisher}/vsextensions/${extension_name}/${version}/vspackage?targetPlatform=${target}"
            existing="$(mktemp)"
            if curl -fsSL "$marketplace_url" -o "$existing"; then
              cmp "$package_path" "$existing" || {
                echo "Marketplace already contains different bytes for $(basename "$vsix")." >&2
                exit 1
              }
              rm -f "$existing"
              echo "Marketplace already contains the verified package $(basename "$vsix")."
              continue
            fi
            rm -f "$existing"
            published=false
            for attempt in 1 2 3 4 5; do
              if pnpm --dir vscode exec vsce publish --no-dependencies --packagePath "$package_path"; then
                published=true
                break
              fi
              echo "Marketplace publish failed for $(basename "$vsix") (attempt ${attempt}/5)."
              sleep "$((attempt * 10))"
            done
            test "$published" = true
            downloaded=false
            for attempt in 1 2 3 4 5; do
              existing="$(mktemp)"
              if curl -fsSL "$marketplace_url" -o "$existing" && cmp "$package_path" "$existing"; then
                downloaded=true
                rm -f "$existing"
                break
              fi
              rm -f "$existing"
              sleep "$((attempt * 10))"
            done
            test "$downloaded" = true
          done
